{% extends "base.html" %}

{% block title %}Create Magazine{% endblock %}

{% block content %}
    <div class="container">

        <h1>Create Magazine</h1>

        <form class="card" id="magazineForm">

            <label>Magazine Title</label>
            <input type="text" id="title" required>

            <label>Description</label>
            <textarea rows="4" id="description"></textarea>

            <label>Cover Image URL</label>
            <input type="text" id="cover">

            <button type="submit">
                Create
            </button>

        </form>

    </div>
{% endblock %}
