{% extends "base.html" %}

{% block title %}Login | MemoryLane{% endblock %}

{% block content %}
    <main class="auth-container">

        <div class="auth-card">

            <h1>Welcome Back</h1>

            <p>
                Continue your MemoryLane journey.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">
                        Email
                    </label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="primary-btn">
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

            <p class="auth-footer">
                Don't have an account?
                <a href="/register">
                    Create Account
                </a>
            </p>

        </div>

    </main>
{% endblock %}
