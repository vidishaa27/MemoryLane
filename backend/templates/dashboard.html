{% extends "base.html" %}

{% block title %}My Magazines{% endblock %}

{% block content %}
    <div class="container">

        <h1>My Magazines</h1>

        <div class="stats">
            <div class="stat-card">
                <h3 id="magazineCount">0</h3>
                <p>Magazines</p>
            </div>

            <div class="stat-card">
                <h3 id="pageCount">0</h3>
                <p>Pages</p>
            </div>

            <div class="stat-card">
                <h3 id="songCount">0</h3>
                <p>Songs</p>
            </div>
        </div>

        <a href="/create-magazine" class="primary-btn">
            + Create Magazine
        </a>

        <div id="magazinesContainer"></div>

    </div>
{% endblock %}

{% block scripts_extra %}
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
{% endblock %}
