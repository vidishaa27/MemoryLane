<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Magazines</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
</head>

<body>

    <nav>

        <!-- Logo -->
        <a href="/" class="logo">
            MemoryLane
        </a>

        <div id="navLinks">

            <a href="/">
                Home
            </a>

        </div>

    </nav>

    <div class="container">

        <h1>My Magazines</h1>

        <div class="stats">
            <div class="stat-card">
                <h3 id="magazineCount">0</h3>
                <p>Magazines</p>
            </div>

            <div class="stat-card">
                <h3 id="pageCount">0</h3>
                <p>Pages</p>
            </div>

            <div class="stat-card">
                <h3 id="songCount">0</h3>
                <p>Songs</p>
            </div>
        </div>

        <a href="/create-magazine" class="primary-btn">
            + Create Magazine
        </a>

        <div id="magazinesContainer"></div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="{{ url_for('static', filename='common.js') }}"></script>
</body>

</html>
