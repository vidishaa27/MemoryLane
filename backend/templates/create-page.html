<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Page</title>
    <!-- Quill CSS -->

    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
</head>

<body>

    <nav>

        <a href="/">
            MemoryLane
        </a>

        <div id="navLinks">

            <a href="/">
                Home
            </a>

        </div>

    </nav>

    <div class="editor-container">

        <!-- =========================
         LEFT SIDE — EDITOR
    ========================== -->

        <div class="editor-panel">

            <h1 id="pageHeading">
                Create Page
            </h1>

            <form id="pageForm">

                <label>
                    Page Title
                </label>

                <input type="text" id="pageTitle" placeholder="Give your memory a title..." required>

                <label>
                    Page Content
                </label>

                <div id="editor"></div>

                <input type="hidden" id="pageContent">

                <label>
                    Image URL
                </label>

                <input type="text" id="pageImage" placeholder="https://example.com/image.jpg">

                <label>
                    Song Link
                </label>

                <input type="text" id="pageSong" placeholder="https://open.spotify.com/...">

                <button type="submit" id="pageSubmitBtn">

                    Add Page

                </button>

            </form>

        </div>


        <!-- =========================
         RIGHT SIDE — PREVIEW
    ========================== -->

        <div class="preview-panel">

            <h2>
                Live Preview
            </h2>

            <div class="preview-page">

                <p class="preview-page-number">
                    Page 1
                </p>

                <h1 id="previewTitle">
                    Your Page Title
                </h1>

                <img id="previewImage" class="preview-image" style="display: none;" alt="Preview Image">

                <div id="previewContent" class="preview-content">

                    <p>
                        Start writing your memory...
                    </p>

                </div>

                <a id="previewSong" class="song-btn" target="_blank" style="display: none;">

                    🎵 Listen to Song

                </a>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="{{ url_for('static', filename='common.js') }}"></script>

</body>

</html>
